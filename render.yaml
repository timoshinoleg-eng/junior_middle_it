services:
  - type: web
    name: junior-middle-it-bot
    runtime: python
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: pip install -r requirements.txt
    # v7 pre-flight: fail the deploy HERE with a readable validation error
    # instead of starting, exiting via sys.exit(1) and being rolled back by
    # the health check. Runs after build, before start; envVars are available.
    preDeployCommand: >-
      python -c "import channel_bot; import sys;
      sys.exit(0 if channel_bot.Config.validate(require_admin=True) else 1)"
    startCommand: python render_main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- copy these from Vercel project settings (olegs-projects) ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # set manually in Render dashboard
      - key: CHANNEL_ID
        sync: false
      # v7 (B03, fail-closed): without this the bot process calls sys.exit(1)
      # at startup -> /health answers 503 -> Render rolls the deploy back.
      # Numeric Telegram user id; set it in the Render dashboard.
      - key: ADMIN_USER_ID
        sync: false
      # v7 (zero-cost storage): Neon Postgres connection string. Without it the
      # bot falls back to the local SQLite file (which is wiped on every Render
      # free restart — the root cause of the duplicate-post incident). Paste the
      # Neon "Connection string" (must include ?sslmode=require) here; psycopg2
      # is installed via requirements.txt and db_backend selects Postgres when
      # this var is present.
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      # --- static config ---
      - key: DEDUP_MODE
        value: telegram_history
      - key: ENABLE_TELEGRAM_CHANNELS
        value: "false"       # Telethon session expired; don't touch
      - key: DISABLE_FILE_LOG
        value: "true"
      - key: CHECK_INTERVAL
        value: "1800"
      # v7 Stage 0 kill-switch: publishing stays OFF until the owner enables it
      # on exactly ONE process (see docs/v7/DECISION_LOG.md, D-02).
      - key: PUBLISH_ENABLED
        value: "false"
      - key: PROCESS_ROLE
        value: "all"      # bot | publisher | all
      # Finite publish ceiling (B05): values < 1 are clamped to 20 by the app;
      # unlimited requires UNLIMITED_POSTS_PER_CYCLE=true (incident-only flag).
      - key: EMERGENCY_MAX_POSTS_PER_CYCLE
        value: "20"
      - key: BOT_USERNAME
        value: junior_jobs_channel_bot
