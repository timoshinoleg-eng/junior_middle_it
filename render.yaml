services:
  - type: web
    name: junior-middle-it-bot
    runtime: python
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: python render_main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- secrets / deployment-specific values ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      # Supabase PostgreSQL connection. Prefer the Frankfurt Supavisor session
      # pooler DSN for the persistent Render process; never commit credentials.
      - key: GROWTH_DATABASE_URL
        sync: false
      # Roll out as true only together with a verified GROWTH_DATABASE_URL.
      # Keeping this deployment-specific prevents an incomplete Blueprint sync
      # from bricking the Telegram bot before the secret is present.
      - key: REQUIRE_DURABLE_GROWTH
        sync: false
      # --- static config ---
      - key: DEDUP_MODE
        value: telegram_history
      - key: ENABLE_TELEGRAM_CHANNELS
        value: "false"
      - key: DISABLE_FILE_LOG
        value: "true"
      - key: CHECK_INTERVAL
        value: "1800"
      - key: EMERGENCY_MAX_POSTS_PER_CYCLE
        value: "0"
      - key: BOT_USERNAME
        value: junior_jobs_channel_bot
