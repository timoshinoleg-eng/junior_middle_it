[project]
name = "junior-middle-it"
version = "7.0.0"
requires-python = ">=3.12,<3.15"
# v7 (B25): kept in sync with requirements.txt (requests/python-dotenv bumped
# past known CVEs; rapidfuzz/sentry-sdk/defusedxml/job-queue extra added).
dependencies = [
  "python-telegram-bot[job-queue]==20.6",
  "python-dotenv>=1.2.2",
  "requests>=2.33.0",
  "telethon>=1.28.5",
  "PySocks>=1.7.1",
  "rapidfuzz>=3.6.0",
  "sentry-sdk>=2.0",
  "defusedxml>=0.7.1",
]

[tool.vercel]
entrypoint = "api.cron:handler"
