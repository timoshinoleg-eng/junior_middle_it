name: Production Smoke

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://junior-middle-it.vercel.app

    steps:
      - name: Wait for current production contract
        id: contract
        shell: bash
        run: |
          set -u
          rm -f /tmp/health.json
          for attempt in $(seq 1 18); do
            code=$(curl -sS --max-time 15 -o /tmp/health.json -w '%{http_code}' \
              "$BASE_URL/api/health" || true)
            if python - <<'PY'
          import json
          try:
              data = json.load(open('/tmp/health.json', encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if 'collector_ready' in data and 'durable_growth' in data else 1)
          PY
            then
              echo "Current production contract detected (HTTP $code)"
              echo "seen=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Production contract mismatch (attempt $attempt/18, HTTP $code)"
            sleep 5
          done
          echo "seen=false" >> "$GITHUB_OUTPUT"
          echo "Current production contract was not observed."

      - name: Diagnose routing mismatch
        if: steps.contract.outputs.seen != 'true'
        shell: bash
        run: |
          set -u
          echo '### DNS'
          echo 'CNAME:'
          dig +short CNAME junior-middle-it.vercel.app || true
          echo 'A:'
          dig +short A junior-middle-it.vercel.app || true
          echo 'AAAA:'
          dig +short AAAA junior-middle-it.vercel.app || true

          paths=(
            '/'
            '/robots.txt'
            '/api/health'
            '/api/cron'
            '/api/index?route=health'
            '/api/index?route=robots'
          )
          for path in "${paths[@]}"; do
            echo
            echo "### $path"
            rm -f /tmp/route.headers /tmp/route.body
            curl -sS --max-time 20 -D /tmp/route.headers -o /tmp/route.body \
              "$BASE_URL$path" || true
            echo '--- headers ---'
            sed -n '1,50p' /tmp/route.headers || true
            echo '--- body (first 1500 bytes) ---'
            head -c 1500 /tmp/route.body 2>/dev/null || true
            echo
          done

      - name: Fail on routing mismatch
        if: steps.contract.outputs.seen != 'true'
        shell: bash
        run: |
          echo 'ERROR: canonical production domain is not serving the current routing contract.'
          exit 1

      - name: Verify sanitized readiness
        if: steps.contract.outputs.seen == 'true'
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 15 -o /tmp/health.json -w '%{http_code}' \
            "$BASE_URL/api/health")
          HEALTH_CODE="$code" python - <<'PY'
          import json, os
          data = json.load(open('/tmp/health.json', encoding='utf-8'))
          print(json.dumps(data, ensure_ascii=False, sort_keys=True))
          assert data.get('service') == 'junior_middle_it'
          assert data.get('collector_ready') is True, data
          assert isinstance(data.get('durable_growth'), bool), data
          assert isinstance(data.get('public_acquisition_ready'), bool), data
          assert os.environ['HEALTH_CODE'] in {'200', '503'}
          rendered = json.dumps(data)
          for forbidden in ('postgresql://', 'Bearer ', 'TELEGRAM_BOT_TOKEN=', 'CRON_SECRET='):
              assert forbidden not in rendered, rendered
          PY

      - name: Verify public routes
        if: steps.contract.outputs.seen == 'true'
        shell: bash
        run: |
          set -euo pipefail
          site_code=$(curl -sS --max-time 20 -o /tmp/site.html -w '%{http_code}' "$BASE_URL/")
          robots_code=$(curl -sS --max-time 15 -o /tmp/robots.txt -w '%{http_code}' "$BASE_URL/robots.txt")
          test "$site_code" = "200"
          test "$robots_code" = "200"
          grep -q 'Junior' /tmp/site.html
          grep -q 'User-agent:' /tmp/robots.txt
          grep -q 'Disallow: /api/' /tmp/robots.txt
          echo "Public routes: site=$site_code robots=$robots_code"

      - name: Verify cron fails closed without bearer auth
        if: steps.contract.outputs.seen == 'true'
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 15 -o /tmp/cron-unauth.json -w '%{http_code}' \
            "$BASE_URL/api/cron")
          cat /tmp/cron-unauth.json
          test "$code" = "401"
          python - <<'PY'
          import json
          data = json.load(open('/tmp/cron-unauth.json', encoding='utf-8'))
          assert data == {'ok': False, 'error': 'unauthorized'}, data
          PY
