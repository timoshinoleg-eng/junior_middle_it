name: Channel Launch Once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[channel-launch]')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching production endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          endpoint="https://junior-middle-it.vercel.app/api/channel-launch"
          for attempt in {1..24}; do
            status="$(curl --silent --show-error \
              --connect-timeout 20 --max-time 60 \
              -o /tmp/channel-launch-probe.json -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$endpoint" || true)"
            if [[ "$status" == "200" ]] && grep -q 'channel-redesign-2026-09-11' /tmp/channel-launch-probe.json; then
              cat /tmp/channel-launch-probe.json
              exit 0
            fi
            echo "Channel launch endpoint not ready (HTTP $status, attempt $attempt/24)" >&2
            sleep 10
          done
          echo "Channel launch endpoint did not become ready" >&2
          exit 1

      - name: Publish demo and information posts exactly once
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://junior-middle-it.vercel.app/api/channel-launch"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error \
            --connect-timeout 20 --max-time 120 \
            -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            -X POST "$endpoint" || true)"
          cat "$response_file"
          if [[ "$status" != "200" ]]; then
            echo "One-shot channel publication failed with HTTP $status; no automatic POST retry to avoid duplicates." >&2
            exit 1
          fi
