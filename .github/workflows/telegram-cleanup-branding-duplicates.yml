name: Telegram Cleanup Branding Duplicates

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE to remove the known branding duplicates
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete approved branding duplicates
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DELETE"
          test -n "$CRON_SECRET"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error \
            --connect-timeout 20 --max-time 180 \
            -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "X-Cleanup-Confirmation: DELETE" \
            -X POST \
            "https://junior-middle-it.vercel.app/api/telegram_branding_admin?action=cleanup" || true)"
          cat "$response_file"
          test "$status" = "200"
          python - "$response_file" <<'PY'
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data.get("ok") is True, data
          assert data.get("failed") == [], data
          print("Telegram branding duplicates cleanup verified")
          PY
