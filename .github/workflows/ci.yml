name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: copilot_test
          POSTGRES_PASSWORD: copilot_test
          POSTGRES_DB: copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot_test -d copilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run unit and policy tests
        env:
          COPILOT_TEST_PG_DSN: postgresql://copilot_test:copilot_test@localhost:5432/copilot_test
        run: |
          python -m unittest -v \
            test_growth_utils \
            test_job_sources_extra \
            test_publication_policy \
            test_publication_authority \
            test_stage0_post_fixes \
            test_message_formatter_growth \
            test_growth_p1 \
            test_resume_matcher \
            test_resume_flow \
            test_saved_searches \
            test_content_magnets \
            test_resume_documents \
            test_interactive_runtime \
            test_serverless_payload_runtime \
            test_edge_payload_writer \
            test_referral_runtime \
            test_public_site \
            test_public_growth_client \
            test_public_acquisition_runtime \
            test_durable_runtime_state \
            test_durable_product_state \
            test_p8_product_loop \
            test_product_i18n \
            test_callback_runtime_hotfix \
            test_channel_bot_soft_link \
            test_webhook_latency_hotfix \
             test_setup_ux_v8 \
             test_interactive_webhook_runtime \
             test_api_webhook_contract \
             test_scheduled_delivery_runtime \
             test_telegram_webhook_admin \
             test_telegram_branding_admin \
             test_p7_growth_metrics \
             test_http_growth_patch \
             test_render_main \
             test_secure_http_logging \
             test_serverless_health \
             test_vercel_router \
             test_vercel_webhook_surfaces \
             test_copilot_fit \
             test_copilot_grade_audit \
             test_copilot_hr_link \
             test_copilot_enrich \
             test_copilot_store \
             test_copilot_credits \
             test_copilot_credit_operations \
             test_copilot_credit_concurrency \
             test_copilot_registry_recovery \
             test_copilot_llm_accounting \
             test_copilot_edge_validator \
             test_copilot_runtime \
             test_copilot_pdf \
             test_copilot_security \
             test_copilot_llm \
             test_copilot_forward \
             test_copilot_outcome \
             test_copilot_upskill \
             test_copilot_webapp_auth \
             test_copilot_webapp_api \
             test_copilot_metrics \
             test_release_verification



      - name: Run formatter regression script
        run: python test_formatter_fix.py
