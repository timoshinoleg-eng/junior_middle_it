name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run unit and policy tests
        run: |
          python -m unittest -v \
            test_growth_utils \
            test_job_sources_extra \
            test_publication_policy \
            test_stage0_post_fixes \
            test_message_formatter_growth \
            test_growth_p1 \
            test_resume_matcher \
            test_resume_flow \
            test_saved_searches \
            test_content_magnets \
            test_resume_documents \
            test_interactive_runtime \
            test_serverless_payload_runtime

      - name: Run formatter regression script
        run: python test_formatter_fix.py
