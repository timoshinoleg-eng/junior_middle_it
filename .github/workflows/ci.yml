name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run unit and policy tests
        run: |
          python -m unittest -v \
            test_growth_utils \
            test_job_sources_extra \
            test_publication_policy \
            test_publication_authority \
            test_stage0_post_fixes \
            test_message_formatter_growth \
            test_growth_p1 \
            test_resume_matcher \
            test_resume_flow \
            test_saved_searches \
            test_content_magnets \
            test_resume_documents \
            test_interactive_runtime \
            test_serverless_payload_runtime \
            test_edge_payload_writer \
            test_referral_runtime \
            test_public_site \
            test_public_growth_client \
            test_public_acquisition_runtime \
            test_durable_runtime_state \
            test_durable_product_state \
            test_p8_product_loop \
            test_product_i18n \
            test_callback_runtime_hotfix \
            test_channel_bot_soft_link \
            test_webhook_latency_hotfix \
            test_interactive_webhook_runtime \
            test_api_webhook_contract \
            test_scheduled_delivery_runtime \
            test_telegram_webhook_admin \
            test_p7_growth_metrics \
            test_http_growth_patch \
            test_render_main \
            test_secure_http_logging \
            test_serverless_health \
            test_vercel_router \
            test_vercel_webhook_surfaces

      - name: Run formatter regression script
        run: python test_formatter_fix.py
