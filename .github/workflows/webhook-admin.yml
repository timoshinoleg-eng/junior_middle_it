name: Telegram Webhook Admin

on:
  workflow_run:
    workflows: ["Production Smoke"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: Webhook action
        required: true
        default: status
        type: choice
        options:
          - status
          - enable
          - disable

permissions:
  contents: read

jobs:
  webhook:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve webhook action
        id: action
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            action="enable"
          else
            action="${{ inputs.action }}"
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Call protected webhook admin endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ACTION: ${{ steps.action.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"

          endpoint="https://junior-middle-it.vercel.app/api/webhook-admin?action=$ACTION"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          # Production Smoke can finish a few seconds before Vercel promotes the
          # matching main deployment. Retry only transient deployment/proxy
          # statuses; auth/configuration errors still fail immediately.
          for attempt in {1..18}; do
            status="$(curl --silent --show-error \
              --connect-timeout 20 --max-time 120 \
              -o "$response_file" -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              -X POST \
              "$endpoint" || true)"

            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              cat "$response_file"
              exit 0
            fi

            cat "$response_file" >&2 || true
            case "$status" in
              404|502|503|504|000)
                if [[ "$attempt" -lt 18 ]]; then
                  echo "Webhook admin endpoint not ready yet (HTTP $status, attempt $attempt/18); retrying..." >&2
                  sleep 10
                  continue
                fi
                ;;
              *)
                echo "Webhook admin request failed with non-transient HTTP $status" >&2
                exit 1
                ;;
            esac
          done

          echo "Webhook admin endpoint did not become ready after deployment grace period" >&2
          exit 1
