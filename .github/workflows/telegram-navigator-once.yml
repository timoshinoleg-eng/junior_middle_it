name: Telegram Navigator Post Once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish and pin the channel navigator post
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          endpoint="https://junior-middle-it.vercel.app/api/telegram_navigator_admin"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for attempt in {1..18}; do
            status="$(curl --silent --show-error \
              --connect-timeout 20 --max-time 120 \
              -o "$response_file" -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              -X POST "$endpoint" || true)"

            if [[ "$status" == "200" ]]; then
              cat "$response_file"
              python - "$response_file" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data.get("ok") is True, data
          assert data.get("navigator_post_ok") is True, data
          assert data.get("bot_username_set") is True, data
          print("Navigator post verified; pinned_message_id=", data.get("pinned_message_id"))
          PY
              exit 0
            fi

            cat "$response_file" >&2 || true
            case "$status" in
              404|502|503|504|000)
                if [[ "$attempt" -lt 18 ]]; then
                  echo "Navigator endpoint not ready yet (HTTP $status, attempt $attempt/18); retrying..." >&2
                  sleep 10
                  continue
                fi
                ;;
              *)
                echo "Navigator request failed with non-transient HTTP $status" >&2
                exit 1
                ;;
            esac
          done

          echo "Navigator endpoint did not succeed" >&2
          exit 1
